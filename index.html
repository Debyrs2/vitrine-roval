<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Digital Roval</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="kiosk-container">

        <header class="kiosk-header">
            <img src="assets/imagens/rovalLogo.png" alt="Roval Farmácia de Manipulação" class="logo">
            <h1>Encontre a fórmula ideal para você!</h1>
        </header>

        <div class="kiosk-body">

            <aside class="sidebar">
                <h2>Categorias</h2>
                <nav class="categories-menu">
                    <button class="category-btn active" data-category="todos">Todos</button>
                    <button class="category-btn" data-category="fitness">Fitness</button>
                    <button class="category-btn" data-category="nutricao">Nutrição</button>
                    <button class="category-btn" data-category="estetica">Estética</button>
                    <button class="category-btn" data-category="sono">Sono & Bem-Estar</button>
                </nav>

                <button class="consultant-call-btn" id="btnSorteio">
                    Falar com uma Consultora
                </button>
            </aside>

            <main class="products-container">
                <div class="product-card">
                    <div class="product-badge">Destaque</div>
                    <img src="assets/imagens/MascFemPote.png" alt="Produto Exemplo" class="product-img">
                    <h3>Composto Antiox Estética</h3>
                    <p>Fórmula exclusiva para rejuvenescimento celular e brilho da pele.</p>
                    <button class="view-more-btn">Ver Detalhes</button>
                </div>
            </main>

        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
